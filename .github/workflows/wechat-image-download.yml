name: Temporary WeChat article image download

on:
  push:
    paths:
      - '.github/workflows/wechat-image-download.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download-images:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Prepare Python environment
        run: |
          python -m pip install --upgrade pip
          pip install playwright beautifulsoup4 requests pillow
          python -m playwright install --with-deps chromium

      - name: Fetch article and download images
        env:
          ARTICLE_URL: 'https://mp.weixin.qq.com/s/ncl6a4i2R7vrFmjVv0gaNA'
        run: |
          cat > /tmp/fetch_wechat_images.py <<'PY'
          import csv
          import hashlib
          import io
          import os
          import re
          import shutil
          import urllib.parse
          import zipfile
          from pathlib import Path

          import requests
          from bs4 import BeautifulSoup
          from PIL import Image
          from playwright.sync_api import sync_playwright

          ARTICLE_URL = os.environ['ARTICLE_URL']
          OUT = Path('wechat_article_images')
          OUT.mkdir(parents=True, exist_ok=True)

          UA = ('Mozilla/5.0 (Windows NT 10.0; Win64; x64) '
                'AppleWebKit/537.36 (KHTML, like Gecko) '
                'Chrome/151.0.0.0 Safari/537.36')

          def clean_url(url):
              if not url:
                  return None
              url = url.strip().replace('&amp;', '&')
              if url.startswith('//'):
                  url = 'https:' + url
              elif url.startswith('http://'):
                  url = 'https://' + url[len('http://'):]
              if not url.startswith('http'):
                  return None
              return url

          def fetch_html():
              # First try a normal browser-like request.
              headers = {
                  'User-Agent': UA,
                  'Referer': 'https://mp.weixin.qq.com/',
                  'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
              }
              try:
                  r = requests.get(ARTICLE_URL, headers=headers, timeout=30)
                  if r.ok and ('js_content' in r.text or 'rich_media_content' in r.text):
                      return r.text, 'requests'
              except Exception:
                  pass

              # Fall back to Chromium so lazy-loaded image URLs are populated.
              with sync_playwright() as p:
                  browser = p.chromium.launch(
                      headless=True,
                      args=['--no-sandbox', '--disable-dev-shm-usage']
                  )
                  context = browser.new_context(
                      user_agent=UA,
                      locale='zh-CN',
                      viewport={'width': 1440, 'height': 1200},
                  )
                  page = context.new_page()
                  page.goto(ARTICLE_URL, wait_until='domcontentloaded', timeout=90000)
                  page.wait_for_timeout(6000)
                  # Trigger lazy loading throughout the article.
                  page.evaluate('''async () => {
                    for (let y = 0; y < document.body.scrollHeight; y += 800) {
                      window.scrollTo(0, y);
                      await new Promise(r => setTimeout(r, 120));
                    }
                    window.scrollTo(0, 0);
                  }''')
                  page.wait_for_timeout(3000)
                  html = page.content()
                  page.screenshot(path='article_full_page.png', full_page=True)
                  browser.close()
                  return html, 'playwright'

          html, method = fetch_html()
          Path('article.html').write_text(html, encoding='utf-8')
          soup = BeautifulSoup(html, 'html.parser')

          title = ''
          title_node = soup.select_one('#activity-name, .rich_media_title')
          if title_node:
              title = title_node.get_text(' ', strip=True)
          if not title:
              ogt = soup.find('meta', attrs={'property': 'og:title'})
              if ogt:
                  title = ogt.get('content', '').strip()

          urls = []
          seen = set()

          def add(url, kind='body'):
              url = clean_url(url)
              if not url:
                  return
              # Ignore data URLs, tracking pixels, emoji and UI sprites.
              low = url.lower()
              if any(x in low for x in ['mmbiz.qpic.cn/mmbiz_png/0', 'emoji', 'spacer.gif']):
                  return
              key = url.split('#', 1)[0]
              if key not in seen:
                  seen.add(key)
                  urls.append((url, kind))

          # Cover image, if available.
          for prop in ('og:image', 'twitter:image'):
              meta = soup.find('meta', attrs={'property': prop}) or soup.find('meta', attrs={'name': prop})
              if meta:
                  add(meta.get('content'), 'cover')

          # Article body only. This avoids WeChat interface icons and ads.
          content = soup.select_one('#js_content, .rich_media_content')
          if content:
              for img in content.find_all('img'):
                  for attr in ('data-src', 'data-original', 'data-backsrc', 'src'):
                      add(img.get(attr), 'body')
              for node in content.find_all(style=True):
                  style = node.get('style', '')
                  for match in re.findall(r'url\([\'\"]?([^\)\'\"]+)', style):
                      add(match, 'background')

          # Some WeChat pages preserve image URLs in script variables.
          if not urls:
              for match in re.findall(r'https?://mmbiz\.qpic\.cn/[^\"\'<>\\ ]+', html):
                  add(match.replace('\\x26', '&').replace('\\/', '/'), 'script')

          session = requests.Session()
          session.headers.update({
              'User-Agent': UA,
              'Referer': ARTICLE_URL,
              'Accept': 'image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8',
          })

          manifest = []
          hashes = set()
          success = 0
          for idx, (url, kind) in enumerate(urls, 1):
              try:
                  response = session.get(url, timeout=45)
                  response.raise_for_status()
                  data = response.content
                  if len(data) < 300:
                      raise ValueError(f'image too small: {len(data)} bytes')

                  digest = hashlib.sha256(data).hexdigest()
                  if digest in hashes:
                      manifest.append([idx, '', kind, url, len(data), 'duplicate skipped'])
                      continue
                  hashes.add(digest)

                  content_type = response.headers.get('content-type', '').split(';')[0].lower()
                  ext_by_type = {
                      'image/jpeg': '.jpg', 'image/jpg': '.jpg', 'image/png': '.png',
                      'image/gif': '.gif', 'image/webp': '.webp', 'image/bmp': '.bmp',
                      'image/svg+xml': '.svg', 'image/avif': '.avif'
                  }
                  ext = ext_by_type.get(content_type, '')
                  width = height = ''
                  if ext != '.svg':
                      try:
                          with Image.open(io.BytesIO(data)) as im:
                              width, height = im.size
                              fmt = (im.format or '').lower()
                              ext = {
                                  'jpeg': '.jpg', 'png': '.png', 'gif': '.gif',
                                  'webp': '.webp', 'bmp': '.bmp', 'avif': '.avif'
                              }.get(fmt, ext)
                      except Exception:
                          pass
                  if not ext:
                      query = urllib.parse.parse_qs(urllib.parse.urlsplit(url).query)
                      wx_fmt = (query.get('wx_fmt') or [''])[0].lower()
                      ext = {
                          'jpeg': '.jpg', 'jpg': '.jpg', 'png': '.png',
                          'gif': '.gif', 'webp': '.webp', 'bmp': '.bmp'
                      }.get(wx_fmt, '.img')

                  success += 1
                  filename = f'{success:03d}{ext}'
                  (OUT / filename).write_bytes(data)
                  manifest.append([idx, filename, kind, url, len(data), f'{width}x{height}' if width else 'downloaded'])
              except Exception as exc:
                  manifest.append([idx, '', kind, url, '', f'failed: {exc}'])

          with (OUT / '图片清单.csv').open('w', encoding='utf-8-sig', newline='') as f:
              writer = csv.writer(f)
              writer.writerow(['页面顺序', '文件名', '类型', '原始地址', '字节数', '尺寸或状态'])
              writer.writerows(manifest)

          (OUT / '说明.txt').write_text(
              f'文章标题：{title or "未识别"}\n'
              f'文章地址：{ARTICLE_URL}\n'
              f'抓取方式：{method}\n'
              f'识别到的图片地址：{len(urls)}\n'
              f'成功保存的去重图片：{success}\n'
              '范围：文章封面及正文内嵌图片；已排除微信公众号界面图标、广告与跟踪像素。\n',
              encoding='utf-8'
          )

          if success == 0:
              print(html[:5000])
              raise SystemExit('No article images were downloaded.')

          with zipfile.ZipFile('微信公众号文章图片.zip', 'w', zipfile.ZIP_DEFLATED) as zf:
              for path in sorted(OUT.rglob('*')):
                  if path.is_file():
                      zf.write(path, path.as_posix())

          print(f'Title: {title}')
          print(f'Found URLs: {len(urls)}; saved unique images: {success}')
          PY
          python /tmp/fetch_wechat_images.py

      - name: Upload image package
        uses: actions/upload-artifact@v4
        with:
          name: wechat-article-images
          path: |
            微信公众号文章图片.zip
            article.html
            article_full_page.png
          if-no-files-found: error
          retention-days: 1
